# Weekly grouped dependency updates. Minor and patch bumps arrive as one PR
# per ecosystem and directory. Majors come as their own PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # n8n-node lint crashes on TypeScript 7. The typescript-eslint that @n8n/node-cli 0.54 bundles accepts
      # typescript below 6.1 only (2026-11-08). Drop when @n8n/node-cli ships a typescript-eslint that accepts TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @n8n/node-cli 1.x is the n8n 3 release candidate line, published under the npm rc dist-tag only.
      # latest is 0.55.6 and beta is 0.56.1 (2026-11-09). Drop this rule once
      # `npm view @n8n/node-cli dist-tags.latest` prints 1.x.
      - dependency-name: "@n8n/node-cli"
        versions: [">=1.0.0"]

# Weekly grouped dependency updates. Minor and patch bumps arrive as one PR
# per ecosystem and directory. Majors come as their own PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # n8n-node lint crashes on TypeScript 7. The typescript-eslint that @n8n/node-cli 0.54 bundles accepts
      # typescript below 6.1 only (2026-11-08). Drop when @n8n/node-cli ships a typescript-eslint that accepts TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @n8n/node-cli stays on the npm latest line. 0.56.x is the beta dist-tag and 1.x is the n8n 3
      # release candidate under rc. latest is 0.55.6 (2026-11-09). Raise the floor here when
      # `npm view @n8n/node-cli dist-tags.latest` moves.
      - dependency-name: "@n8n/node-cli"
        versions: [">=0.56.0"]
